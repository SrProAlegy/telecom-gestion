name: Validar base
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno efímero
        run: |
          cp .env.example .env
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - name: Sintaxis PHP
        run: docker compose exec -T web sh -c 'find backend frontend docker/php tests -path "*/herramientas/*" -prune -o -name "*.php" -exec php -l {} \; | tee /tmp/lint; ! grep -q "Errors parsing" /tmp/lint'
      - run: docker compose exec -T web php tests/integration.php
      - run: docker compose exec -T web php tests/http.php
      - name: Backend y concurrencia en base aislada
        run: docker compose -f tests/compose.yaml up --build --abort-on-container-exit --exit-code-from pruebas
      - name: Recuperación ante caída de MySQL
        run: |
          trap 'docker compose up -d --wait --wait-timeout 120' EXIT
          docker compose stop db
          docker compose exec -T web php tests/unavailable.php
      - name: Respaldo y restauración aislada
        run: |
          docker compose cp tests/backup-roundtrip.sh db:/tmp/telcom-backup-check.sh
          docker compose exec -T db sh /tmp/telcom-backup-check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/herramientas
      - run: npm run lint --prefix tests/herramientas
      - run: npm test --prefix tests/herramientas
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer
      - run: composer --working-dir=tests/herramientas install --no-interaction --prefer-dist
      - run: composer --working-dir=tests/herramientas lint
      - if: always()
        run: |
          docker compose logs --no-color
          docker compose down
          docker compose -f tests/compose.yaml down
