name: telcom-gestion-pruebas
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telcom_pruebas
      MYSQL_USER: telcom_pruebas
      MYSQL_PASSWORD: solo_pruebas_aisladas
      MYSQL_ROOT_PASSWORD: root_pruebas_aisladas
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT version FROM schema_version' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 50
  pruebas:
    build: ..
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: telcom_pruebas
      DB_USERNAME: telcom_pruebas
      DB_PASSWORD: solo_pruebas_aisladas
    volumes:
      - ../:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "tests/backend.php"]
